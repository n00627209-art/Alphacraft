<script>
let SD1=0,SD2=0,SAVED=[new Map(),new Map(),new Map()],DIM=0,inGame=false,WID=null,GM='survival',DIFF=2,flying=false,lastJ=0,sneakHeld=false,kbx=0,kbz=0,dragonDead=false,hT=0,sleepT=-1,sleepBed=null,swingT=-1,equipT=1,eatT=0,handKey='';const iconCan={};
const ARM={},APTS=[[1,3,2,1],[2,6,5,2],[2,5,3,1],[3,8,6,3]],ACOL=['#a0643c','#e6e6e6','#f5d742','#4ee8d8'];
for(let t=0;t<4;t++)for(let sl=0;sl<4;sl++)ARM[150+t*4+sl]={slot:sl,pts:APTS[t][sl],t};
const arm=[null,null,null,null],armPts=()=>arm.reduce((a,s)=>a+(s?ARM[s.id].pts:0),0);
let hnKey='',hnT=0;
// ---------- атлас текстур ----------
const ac=document.createElement('canvas');ac.width=128;ac.height=128;
const g=ac.getContext('2d');
let rs=3;const rr=()=>(rs=(rs*16807)%2147483647)/2147483647;
const TR=t=>{let s=t*7919+13;return()=>(s=(s*16807)%2147483647)/2147483647;};
const cl=v=>v<0?0:v>255?255:v,shd=(c,k)=>[cl(c[0]+k),cl(c[1]+k),cl(c[2]+k)];
function blit(t,F){
 const ox=(t%8)*16,oy=Math.floor(t/8)*16;
 for(let y=0;y<16;y++)for(let x=0;x<16;x++){const c=F[y*16+x];if(!c)continue;g.fillStyle='rgb('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+')';g.fillRect(ox+x,oy+y,1,1);}
}
function blot(t,pal,blur,seed){
 const r=TR(t+(seed||0)*31);let cur=[];for(let i=0;i<256;i++)cur.push(r());
 for(let k=0;k<blur;k++){const nx=[];for(let y=0;y<16;y++)for(let x=0;x<16;x++){let s=0;for(const [dx,dy] of [[0,0],[1,0],[-1,0],[0,1],[0,-1]])s+=cur[((y+dy+16)&15)*16+((x+dx+16)&15)];nx.push(s/5);}cur=nx;}
 const mn=Math.min(...cur),mx=Math.max(...cur);
 return cur.map(v=>pal[Math.min(pal.length-1,Math.floor((v-mn)/(mx-mn+1e-9)*pal.length))].slice());
}
function vor(t,n){
 const r=TR(t*3+5),pts=[];for(let i=0;i<n;i++)pts.push([r()*16,r()*16]);
 const cell=[];
 for(let y=0;y<16;y++)for(let x=0;x<16;x++){let best=0,bd=1e9;pts.forEach((p,i)=>{let dx=Math.abs(x-p[0]),dy=Math.abs(y-p[1]);dx=Math.min(dx,16-dx);dy=Math.min(dy,16-dy);const d=dx*dx+dy*dy;if(d<bd){bd=d;best=i;}});cell.push(best);}
 return cell;
}
const edgeAt=(cell,x,y)=>{const c=cell[y*16+x];for(const [dx,dy] of [[1,0],[0,1],[-1,0],[0,-1]])if(cell[((y+dy+16)&15)*16+((x+dx+16)&15)]!=c)return true;return false;};
const GRASS=[[76,134,46],[88,150,54],[101,166,64],[115,182,76],[130,198,90]];
const DIRT=[[106,72,48],[121,85,58],[134,96,67],[146,106,75],[158,116,84]];
const STONE=[[104,104,104],[115,115,115],[125,125,125],[136,136,136],[147,147,147]];
const NETH=[[84,34,34],[98,44,44],[112,54,53],[128,66,64],[148,80,76]];
// 0 трава сверху
blit(0,blot(0,GRASS,1));
// 1 трава сбоку
{const F=blot(2,DIRT,1),G=blot(0,GRASS,1),r=TR(1);
 for(let x=0;x<16;x++){const h=3+(r()<.5?1:0)+(r()<.18?1:0);for(let y=0;y<h;y++)F[y*16+x]=G[y*16+x];
  if(r()<.4){F[h*16+x]=shd(G[h*16+x],-22);}}
 blit(1,F);}
// 2 земля
{const F=blot(2,DIRT,1),r=TR(22);for(let i=0;i<4;i++)F[Math.floor(r()*256)]=[128,124,118];blit(2,F);}
// 3 камень
blit(3,blot(3,STONE,1));
// 4 булыжник
{const cell=vor(4,11),r=TR(4),base=[];for(let i=0;i<11;i++)base.push(98+Math.floor(r()*38));
 const F=[];for(let y=0;y<16;y++)for(let x=0;x<16;x++){const c=cell[y*16+x];let v=base[c]+(r()-.5)*12;if(edgeAt(cell,x,y))v=56+r()*12;else if(edgeAt(cell,(x+15)&15,y)||edgeAt(cell,x,(y+15)&15))v+=10;F.push([v,v,v]);}
 blit(4,F);}
// 5 бревно сбоку
{const r=TR(5),cols=[];for(let x=0;x<16;x++)cols.push([[84,62,34],[98,76,44],[110,86,52],[92,70,40]][Math.floor(r()*4)]);
 const F=[];for(let y=0;y<16;y++)for(let x=0;x<16;x++)F.push(shd(cols[x],(r()-.5)*12));
 for(const [kx,ky] of [[3,4],[11,10]]){F[ky*16+kx]=[58,42,22];F[ky*16+kx+1]=[66,48,26];F[(ky+1)*16+kx]=[66,48,26];}
 blit(5,F);}
// 6 бревно сверху
{const r=TR(6),F=[];for(let y=0;y<16;y++)for(let x=0;x<16;x++){const d=Math.max(Math.abs(x-7.5),Math.abs(y-7.5));let c;
 if(d>6.5)c=shd([92,70,40],(r()-.5)*14);else{const rad=Math.hypot(x-7.5,y-7.5);c=shd([178,146,90],(r()-.5)*10);if(Math.floor(rad)%3==2)c=shd([150,118,68],(r()-.5)*8);if(rad<1.6)c=shd([196,164,104],0);}F.push(c);}
 blit(6,F);}
// 7 доски
function planks(t,seed){const r=TR(t+seed),F=[];for(let y=0;y<16;y++){const b=y>>2,rowShade=(r()-.5)*10;for(let x=0;x<16;x++){let c=shd([172,139,84],rowShade+(r()-.5)*8);if(y%4==3)c=shd([120,94,52],(r()-.5)*6);else if(x==((b*5+3)&15))c=shd([142,112,64],(r()-.5)*6);F.push(c);}}return F;}
blit(7,planks(7,0));
// 8 листва
{const F=blot(8,[[30,82,22],[42,100,30],[54,118,38],[68,138,48],[86,158,60]],1),r=TR(88);for(let i=0;i<256;i++)if(r()<.08)F[i]=[20,58,14];blit(8,F);}
// 9 песок
blit(9,blot(9,[[200,188,142],[211,199,152],[221,209,162],[231,220,174]],1));
// 10 бедрок
{const F=blot(10,[[36,36,36],[58,58,58],[82,82,82],[106,106,106],[130,130,130]],0),r=TR(100);for(let i=0;i<10;i++){const x=Math.floor(r()*14),y=Math.floor(r()*14);F[y*16+x]=[24,24,24];F[y*16+x+1]=[30,30,30];}blit(10,F);}
// 11 верстак сверху
{const F=planks(11,3);for(let y=0;y<16;y++)for(let x=0;x<16;x++){const edge=x==0||y==0||x==15||y==15;const grid=(x==5||x==10||y==5||y==10);const c=F[y*16+x];
 F[y*16+x]=edge?[88,60,28]:grid?[112,78,38]:shd([176,142,86],(c[0]%7)-3);}blit(11,F);}
// 12 верстак сбоку
{const F=planks(12,5);for(let y=0;y<16;y++)for(let x=0;x<16;x++)if(y<3)F[y*16+x]=shd([104,72,36],(x%3)-1);
 for(let x=2;x<=6;x++)F[7*16+x]=[190,190,198];for(let x=2;x<=5;x++)F[8*16+x]=[170,170,178];F[8*16+1]=[120,86,44];F[7*16+1]=[120,86,44];
 for(let x=9;x<=12;x++){F[6*16+x]=[98,98,108];F[7*16+x]=[78,78,88];}for(let y=8;y<=13;y++){F[y*16+10]=[124,90,46];F[y*16+11]=[104,74,38];}
 blit(12,F);}
// 13 печь спереди
{const F=blot(13,STONE,1);for(let y=0;y<16;y++)for(let x=0;x<16;x++){
 if(x==0||y==0||x==15||y==15)F[y*16+x]=[80,80,80];
 if(x>=4&&x<=11&&y>=6&&y<=12)F[y*16+x]=[28,28,30];
 if(x>=4&&x<=11&&y>=3&&y<=4)F[y*16+x]=[56,56,58];
 if(x>=4&&x<=11&&y==13)F[y*16+x]=[90,90,92];}
 blit(13,F);}
// 14 шерсть
blit(14,blot(14,[[226,226,226],[232,232,232],[238,238,238],[244,244,244]],0));
// руды
function oreOn(t,base,pal,seed){const F=base.map(c=>c.slice()),r=TR(t*11+seed);
 for(let k=0;k<9;k++){let x=1+Math.floor(r()*13),y=1+Math.floor(r()*13);const n=3+Math.floor(r()*3);for(let i=0;i<n;i++){F[y*16+x]=pal[Math.floor(r()*pal.length)];x=Math.max(0,Math.min(15,x+Math.floor(r()*3)-1));y=Math.max(0,Math.min(15,y+Math.floor(r()*3)-1));}}
 blit(t,F);}
const SB=()=>blot(3,STONE,1);
oreOn(15,SB(),[[18,18,18],[40,40,40],[64,64,64]],1);
oreOn(16,SB(),[[216,175,147],[190,150,120],[232,204,178]],2);
oreOn(17,SB(),[[216,126,84],[176,100,62],[84,170,140]],3);
oreOn(18,SB(),[[252,238,75],[222,190,40],[255,250,160]],4);
oreOn(19,SB(),[[92,219,213],[58,168,188],[205,252,248]],5);
// 20 вода
{const F=[],r=TR(20);for(let y=0;y<16;y++)for(let x=0;x<16;x++){const w=.5+.5*Math.sin(x*.9+y*.45)*Math.sin(y*.8-x*.3);const k=w*.7+r()*.15;F.push([48+k*50,108+k*45,216+k*28]);}blit(20,F);}
// 21 лава
blit(21,blot(21,[[150,35,8],[196,66,10],[232,112,14],[250,165,30],[255,214,68]],2));
// 22 обсидиан
blit(22,blot(22,[[12,6,22],[22,12,36],[34,18,54],[52,28,84],[76,40,118]],1));
// 23 незерак
{const F=blot(23,NETH,1),r=TR(230);for(let i=0;i<256;i++)if(r()<.05)F[i]=[70,26,26];blit(23,F);}
// 24 светящийся камень
{const cell=vor(24,9),r=TR(24),pal=[[255,238,140],[246,210,100],[235,185,70],[250,225,120]],F=[];for(let y=0;y<16;y++)for(let x=0;x<16;x++){const c=cell[y*16+x];F.push(edgeAt(cell,x,y)?[176,124,44]:shd(pal[c%4],(r()-.5)*14));}blit(24,F);}
// 25 кварцевая руда
oreOn(25,blot(23,NETH,1),[[238,232,222],[204,198,188],[255,252,246]],6);
// 26 песок душ
{const F=blot(26,[[62,46,36],[74,56,44],[86,66,52],[98,76,60]],1);for(const [x,y] of [[3,3],[10,2],[5,9],[12,11]]){F[y*16+x]=[34,24,18];F[y*16+x+1]=[40,28,22];F[(y+1)*16+x]=[40,28,22];F[(y+1)*16+x+1]=[48,34,26];}blit(26,F);}
// 27 эндерняк

function sprite(draw,pal){
 const G=Array.from({length:16},()=>Array(16).fill(0));
 const set=(x,y,k)=>{x=Math.round(x);y=Math.round(y);if(x>=0&&x<16&&y>=0&&y<16)G[y][x]=k;};
 const line=(x0,y0,x1,y1,k)=>{const n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0))||1;for(let i=0;i<=n;i++)set(x0+(x1-x0)*i/n,y0+(y1-y0)*i/n,k);};
 const rect=(x,y,w,h,k)=>{for(let j=0;j<h;j++)for(let i=0;i<w;i++)set(x+i,y+j,k);};
 const ell=(cx,cy,rx,ry,k)=>{for(let y=0;y<16;y++)for(let x=0;x<16;x++)if(((x+.5-cx)/rx)**2+((y+.5-cy)/ry)**2<=1)set(x,y,k);};
 draw({set,line,rect,ell,G});
 const c=document.createElement('canvas');c.width=c.height=16;const q=c.getContext('2d');
 const at=(x,y)=>(x<0||y<0||x>15||y>15)?0:G[y][x];
 const col=(k,x,y)=>{
  const p=pal[k]||[255,0,255];
  if(k=='m'){const lt=!at(x-1,y)||!at(x,y-1),dk=!at(x+1,y)||!at(x,y+1);
   if(lt&&!dk)return pal.M||p;if(dk&&!lt)return pal.n||p;}
  return p;
 };
 const o=pal.o||[32,22,18];
 for(let y=0;y<16;y++)for(let x=0;x<16;x++){
  let c2=null;
  if(G[y][x])c2=col(G[y][x],x,y);
  else if(at(x-1,y)||at(x+1,y)||at(x,y-1)||at(x,y+1))c2=o;
  if(c2){q.fillStyle='rgb('+c2[0]+','+c2[1]+','+c2[2]+')';q.fillRect(x,y,1,1);}
 }
 return c;
}

function monAI(m,dt){
 const t=m.type;
 m.cd-=dt;m.age+=dt;
 if(t!='dragon'&&Math.hypot(m.x-p.x,m.z-p.z)>75){scene.remove(m.g);mobs.splice(mobs.indexOf(m),1);return true;}
 if(DIFF==0&&t!='dragon'&&!m.fr){scene.remove(m.g);mobs.splice(mobs.indexOf(m),1);return true;}
 if((t=='zombie'||t=='skeleton')&&DIM==0&&Math.sin(tod*6.2832)>.1){
  m.bt=(m.bt||0)+dt;
  if(m.bt>=1){m.bt=0;if(skyOpen(m.x,m.y,m.z)){m.hp-=2;if(m.hp<=0){killMob(m);return true;}}}
 }
 const dx=p.x-m.x,dz=p.z-m.z,dy=p.y-m.y,dist=Math.hypot(dx,dz),face=Math.atan2(-dx,-dz);
 if(t!='dragon'){m.x+=m.kx*dt;m.z+=m.kz*dt;m.kx*=.9;m.kz*=.9;}
 const toward=sp=>{if(dist>.8)gmove(m,dx/dist*sp,dz/dist*sp,dt);else gmove(m,0,0,dt);};
 const melee=(rng,dmg,cdv)=>{if(dist<rng&&Math.abs(dy)<1.6&&m.cd<=0){m.cd=cdv;mobHurt(dmg,m.x,m.z);}};
 const wander=()=>{m.t-=dt;if(m.t<=0){m.t=2+rnd()*4;m.go=rnd()<.5;m.yaw=rnd()*6.28;}if(m.go)gmove(m,-Math.sin(m.yaw)*.9,-Math.cos(m.yaw)*.9,dt);else gmove(m,0,0,dt);};
 if(t=='zombie'||t=='wither'){
  if(dist<28){m.yaw=face;toward((t=='wither'?2.6:2.3)*(DIFF==3?1.15:1));melee(1.3,t=='wither'?5:3,1);}else wander();
 }else if(t=='zpig'||t=='piglin'){
  if(m.trade>0){
   m.trade-=dt;m.yaw=face;gmove(m,0,0,dt);
   if(m.trade<=0){const b=pickBarter(),n=b==70?1:2+Math.floor(rnd()*4);for(let i=0;i<n;i++)spawnDrop(b,m.x+(p.x-m.x)*.3,m.y+1.2,m.z+(p.z-m.z)*.3);}
  }else if(m.agg&&dist<40){m.yaw=face;toward(t=='zpig'?3:2.8);melee(1.4,t=='zpig'?5:4,1);}
  else wander();
 }else if(t=='skeleton'){
  if(dist<22){
   m.yaw=face;
   if(dist>10)toward(1.8);else if(dist<6)gmove(m,-dx/dist*1.8,-dz/dist*1.8,dt);else gmove(m,0,0,dt);
   if(m.cd<=0&&dist<20){m.cd=2.2;shoot(m,'arrow');}
  }else wander();
 }else if(t=='creeper'){
  if(dist<24){
   m.yaw=face;
   if(dist<3.3){m.fz=(m.fz||0)+dt;gmove(m,0,0,dt);if(m.fz>1.5){explode(m.x,m.y+.8,m.z,3.2,18,true);scene.remove(m.g);mobs.splice(mobs.indexOf(m),1);return true;}}
   else{m.fz=Math.max(0,(m.fz||0)-dt*2);toward(2.2);}
   m.g.scale.setScalar(1+(m.fz||0)*.12);
  }else wander();
 }else if(t=='enderman'){
  if(!m.agg){
   const cp=Math.cos(pitch),fx=-Math.sin(yaw)*cp,fy=Math.sin(pitch),fz=-Math.cos(yaw)*cp,vx=m.x-p.x,vy=m.y+2.4-(p.y+1.6),vz=m.z-p.z,vl=Math.hypot(vx,vy,vz)||1;
   if(vl<40&&(fx*vx+fy*vy+fz*vz)/vl>.985)m.agg=true;
   wander();
  }else{
   m.yaw=face;toward(4);melee(1.6,7,1);
   if(rnd()<dt*.2)etp(m);
  }
 }else if(t=='ghast'){
  m.ang=(m.ang||rnd()*6)+dt*.15;
  fmove(m,p.x+Math.cos(m.ang)*18,p.y+9+Math.sin(m.age*.5)*3,p.z+Math.sin(m.ang)*18,2.5,dt);
  m.yaw=face;
  if(dist<45&&m.cd<=0){m.cd=3.5;shoot(m,'big');}
 }else if(t=='blaze'){
  m.ang=(m.ang||rnd()*6)+dt*.4;
  fmove(m,p.x+Math.cos(m.ang)*6,p.y+3.5+Math.sin(m.age)*1.5,p.z+Math.sin(m.ang)*6,3,dt);
  m.yaw=face;
  if(m.cd<=0&&dist<24){m.cd=4;m.burst=3;m.cd2=0;}
  if(m.burst>0){m.cd2-=dt;if(m.cd2<=0){m.cd2=.35;m.burst--;shoot(m,'small');}}
 }else if(t=='villager'){
  m.t-=dt;if(m.t<=0){m.t=3+rnd()*5;m.go=rnd()<.5;m.yaw=rnd()*6.28;}
  if(m.go){if(Math.hypot(m.x-m.hx,m.z-m.hz)>12)m.yaw=Math.atan2(-(m.hx-m.x),-(m.hz-m.z));gmove(m,-Math.sin(m.yaw)*.8,-Math.cos(m.yaw)*.8,dt);}else gmove(m,0,0,dt);
 }else if(t=='golem'){
  let tg=null,bd=18;
  for(const o of mobs)if(o.hs&&!o.fr&&o.type!='piglin'&&o.type!='zpig'&&o.type!='ghast'&&o.type!='blaze'&&o.type!='dragon'){const d=Math.hypot(o.x-m.x,o.z-m.z);if(d<bd){bd=d;tg=o;}}
  if(m.agg&&dist<30){m.yaw=face;toward(3);melee(2.4,7,1.2);}
  else if(tg){
   const tx=tg.x-m.x,tz=tg.z-m.z,td=Math.hypot(tx,tz)||1;m.yaw=Math.atan2(-tx,-tz);
   if(td>1.8)gmove(m,tx/td*3.2,tz/td*3.2,dt);
   if(td<2.4&&m.cd<=0){m.cd=1.2;tg.hp-=12;tg.kx=tx/td*8;tg.kz=tz/td*8;if(tg.hp<=0)killMob(tg);}
  }else{m.t-=dt;if(m.t<=0){m.t=3+rnd()*4;m.go=rnd()<.5;m.yaw=rnd()*6.28;}if(m.go){if(Math.hypot(m.x-m.hx,m.z-m.hz)>14)m.yaw=Math.atan2(-(m.hx-m.x),-(m.hz-m.z));gmove(m,-Math.sin(m.yaw)*.9,-Math.cos(m.yaw)*.9,dt);}else gmove(m,0,0,dt);}
 }else if(t=='dragon'){
  m.mt-=dt;
  if(m.mode==0){
   m.ang+=dt*.4;fmove(m,Math.cos(m.ang)*38,84+Math.sin(m.age)*4,Math.sin(m.ang)*38,14,dt,true);
   if(m.mt<=0){m.mode=1;m.mt=5;msg('Дракон пикирует!');}
  }else{
   fmove(m,p.x,p.y+1,p.z,22,dt,true);
   if(Math.hypot(m.x-p.x,m.y-p.y-1,m.z-p.z)<5&&m.cd<=0){m.cd=1.2;mobHurt(8,m.x,m.z);}
   if(m.mt<=0){m.mode=0;m.mt=12;}
  }
  m.yaw=Math.atan2(-(m.vx||0),-(m.vz||0));
  const f=Math.sin(m.age*3)*.5;m.g.userData.wl.rotation.z=-f;m.g.userData.wr.rotation.z=f;
 }
 m.g.position.set(m.x,m.y,m.z);m.g.rotation.y=m.yaw;animMob(m,dt);
 return false;
}

function scrEdit(id){

 menuShow(`<div class="hdr"><i data-act="play">‹</i><b>Редактировать мир</b><i></i></div><div class="wrap" style="max-width:520px"><div class="pre" style="background-image:url(${w.preview})"></div><h4>Название мира</h4><input class="in" id="enm" maxlength="30" value="${esc(w.name)}"><div class="desc">Сид: ${w.seed} · ${w.mode=='creative'?'Творческий':'Выживание'} · ${DIFFN[w.diff]}</div><button class="mb g" data-act="rename" data-id="${id}">Сохранить название</button><button class="mb" style="background:#a33;color:#fff" data-act="del" data-id="${id}">Удалить мир</button></div>`);
}
function scrSettings(){
 menuShow(`<div class="hdr"><i data-act="back">‹</i><b>Настройки</b><i></i></div><div class="wrap" style="max-width:520px"><h4>Дальность прорисовки: <span id="rdv">${settings.rd}</span> чанков</h4><input type="range" id="rd" min="2" max="8" value="${settings.rd}" style="width:100%"><h4>Разрешение картинки</h4><div class="opt">${[[.75,'Очень быстро'],[1,'Быстро'],[1.5,'Средне'],[2,'Чётко']].map(([v,n])=>`<button class="${settings.res==v?'on':''}" data-act="res" data-v="${v}">${n}</button>`).join('')}</div><div class="desc">Чем выше значения, тем больше нагрузка на телефон.</div></div>`);
}
function scrPause(){
 const w=worlds.find(x=>x.id==WID)||{name:'',seed:''};
 menuShow(`<div class="logo" style="font-size:34px;margin-top:8vh">Пауза</div><button class="mb g" data-act="resume">Вернуться в игру</button><button class="mb" data-act="save">Сохранить</button><button class="mb" data-act="settings">Настройки</button><button class="mb" data-act="quit">Сохранить и выйти</button><div class="ver">${esc(w.name)} · сид ${w.seed}</div>`,'pause');
}
function openPause(){if(!inGame||menuOpen)return;if(invEl.style.display=='block')closeInv();paused=true;mining=false;scrPause();}
function doResume(){menuHide();paused=false;last=performance.now();if(!('ontouchstart' in window)&&cv.requestPointerLock)cv.requestPointerLock();}
function quitWorld(){
 saveWorld();inGame=false;paused=false;
 document.body.classList.remove('ingame','creative');
 suppress=true;if(document.exitPointerLock)document.exitPointerLock();setTimeout(()=>suppress=false,300);
 WID=null;document.getElementById('boss').style.display='none';scrMain();
}
const seedOf=()=>{const t=(cw.seedText||'').trim();if(t==='')return cw.rand;if(/^-?\d+$/.test(t))return Number(t)>>>0;let h=7;for(const ch of t)h=Math.imul(h^ch.charCodeAt(0),16777619);return h>>>0;};
function makeWorld(){
 const seed=seedOf(),w={id:'w'+Date.now().toString(36),name:cw.name.trim()||'Мой мир',seed,mode:cw.mode,diff:cw.diff,created:Date.now(),last:Date.now(),preview:makePrev(seed)};
 worlds.push(w);LS.set('mc_worlds',worlds);startWorld(w);
}
async function startWorld(w){
 if(!w)return;
 menuShow('<div class="load">Загрузка мира…</div>');
 await openDB();
 SD1=(w.seed*7919)|0;SD2=(w.seed*104729+12345)|0;
 SAVED=await idbAll(w.id);
 dimChunks.forEach(mp=>{for(const c of mp.values())freeMesh(c);mp.clear();});
 chunks=dimChunks[0];DIM=0;lcx=1e9;queue=[];pcx=1e9;pcz=1e9;
 mobs.forEach(m=>scene.remove(m.g));mobs.length=0;
 drops.forEach(d=>{scene.remove(d.m);});drops.length=0;
 parts.forEach(m=>{scene.remove(m);m.material.dispose();});parts.length=0;
 furn.clear();aw.clear();al.clear();dirty.clear();
 inv.fill(null);cg.fill(null);held=null;fcur=null;arm.fill(null);bedPos=null;torchMap.clear();sleepT=-1;chests.clear();cropSet.clear();vcache.clear();hnKey='';invEl.style.display='none';mining=false;
 WID=w.id;GM=w.mode;DIFF=w.diff;flying=false;SP=calcSP();dragonDead=false;eyes.forEach(e=>scene.remove(e.m));eyes.length=0;projs.forEach(q=>scene.remove(q.m));projs.length=0;kbx=kbz=0;
 const sv=LS.get('mc_save_'+w.id,null);
 if(sv){
  if(sv.dim)setDim(sv.dim);
  p.x=sv.p.x;p.y=sv.p.y;p.z=sv.p.z;p.vy=0;hp=sv.hp;food=sv.food;air=sv.air;tod=sv.tod;sel=sv.sel;yaw=sv.yaw;pitch=sv.pitch;
  flying=!!sv.flying&&GM=='creative';dragonDead=!!sv.dd;sv.inv.forEach((s,i)=>inv[i]=s);if(sv.arm)sv.arm.forEach((s,i)=>arm[i]=s);bedPos=sv.bed||null;if(sv.chests)for(const [k,v] of sv.chests)chests.set(k,v);if(sv.crops)sv.crops.forEach(k=>cropSet.add(k));if(sv.torches)for(const t of sv.torches)torchMap.set(fkey(t[0],t[1],t[2]),t);for(const [k,v] of sv.furn)furn.set(String(k).includes(':')?k:'0:'+k,v);
 }else{p.x=SP.x;p.y=SP.y+3;p.z=SP.z;p.vy=0;hp=20;food=20;air=15;tod=.08;sel=0;yaw=0;pitch=0;}
 burn=0;
 document.body.classList.add('ingame');document.body.classList.toggle('creative',GM=='creative');
 applyRender();
 for(let i=0;i<60;i++)trySpawn();
 renderBar();renderStats();menuHide();paused=false;inGame=true;last=performance.now();
 msg(GM=='creative'?'Творческий режим: двойной прыжок — полёт':'Мир сохраняется автоматически');
}
menuEl.onclick=e=>{
 const el=e.target.closest('[data-act]');if(!el)return;
 const a=el.dataset.act,id=el.dataset.id,v=el.dataset.v;
 if(a=='main')scrMain();
 else if(a=='play')scrPlay();
 else if(a=='settings')scrSettings();
 else if(a=='back'){inGame?scrPause():scrMain();}
 else if(a=='create'){cw={name:'',mode:'survival',diff:2,seedText:'',rand:(Math.random()*4294967296)>>>0,tab:0};cw.prev=makePrev(cw.rand);scrCreate();}
 else if(a=='tab0'||a=='tab1'){cw.tab=+a[3];scrCreate();}
 else if(a=='gm'){cw.mode=v;scrCreate();}
 else if(a=='df'){cw.diff=+v;scrCreate();}
 else if(a=='make')makeWorld();
 else if(a=='open')startWorld(worlds.find(w=>w.id==id));
 else if(a=='edit')scrEdit(id);
 else if(a=='rename'){const w=worlds.find(x=>x.id==id),n=document.getElementById('enm').value.trim();if(w&&n){w.name=n;LS.set('mc_worlds',worlds);}scrPlay();}
 else if(a=='del'){if(el.dataset.sure){delWorld(id);scrPlay();}else{el.dataset.sure=1;el.textContent='Точно удалить?';}}
 else if(a=='resume')doResume();
 else if(a=='save'){saveWorld();el.textContent='Сохранено ✓';}
 else if(a=='quit')quitWorld();
 else if(a=='res'){settings.res=+v;LS.set('mc_settings',settings);applyRender();scrSettings();}
};
menuEl.oninput=e=>{
 const t=e.target;
 if(t.id=='cwName')cw.name=t.value;
 else if(t.id=='cwSeed'){cw.seedText=t.value;cw.prev=makePrev(seedOf());document.getElementById('pre').style.backgroundImage='url('+cw.prev+')';}
 else if(t.id=='rd'){settings.rd=+t.value;document.getElementById('rdv').textContent=t.value;LS.set('mc_settings',settings);applyRender();}
};
pbEl.onclick=openPause;
document.addEventListener('pointerlockchange',()=>{if(!document.pointerLockElement&&inGame&&!menuOpen&&!suppress&&invEl.style.display!='block')openPause();});
addEventListener('pagehide',()=>{if(inGame)saveWorld();});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&inGame)saveWorld();});
setInterval(()=>{if(inGame&&!paused)saveWorld();},15000);
{const b=document.getElementById('b6');b.addEventListener('touchstart',e=>{e.preventDefault();e.stopPropagation();sneakHeld=true;},{passive:false});b.addEventListener('touchend',()=>sneakHeld=false);b.addEventListener('touchcancel',()=>sneakHeld=false);}
let last=performance.now();
(function loop(now){
 requestAnimationFrame(loop);
 const dt=Math.min((now-last)/1000,.05);last=now;
 if(!inGame||paused)return;
 step(dt);if(gyro)yaw-=gyr*dt*.035;
 updChunks();updMobs(dt);updDrops(dt);updFluid(dt);updProj(dt);updEyes(dt);updCrops(dt);updVillage(dt);
 {const dr=mobs.find(m=>m.type=='dragon'),bs=document.getElementById('boss');bs.style.display=dr?'block':'none';if(dr)document.getElementById('bossf').style.width=Math.max(0,dr.hp/2)+'%';}
 clouds.forEach(m=>{m.position.x+=dt*.8;const dx=m.position.x-p.x,dz=m.position.z-p.z;if(dx>120)m.position.x-=240;if(dx<-120)m.position.x+=240;if(dz>120)m.position.z-=240;if(dz<-120)m.position.z+=240;});
 {
  const dxw=p.x-lpx,dzw=p.z-lpz;lpx=p.x;lpz=p.z;const sp=Math.hypot(dxw,dzw)/Math.max(dt,1e-3);
  if(p.g&&sp>.6&&sp<12&&!flying){bobPh+=sp*dt*2.4;bobA=Math.min(1,bobA+dt*7);}else bobA=Math.max(0,bobA-dt*6);
  camera.position.set(p.x+Math.cos(bobPh)*.02*bobA*Math.cos(yaw),p.y+1.6+Math.abs(Math.sin(bobPh))*.07*bobA,p.z-Math.cos(bobPh)*.02*bobA*Math.sin(yaw));
  camera.rotation.set(pitch,yaw,Math.sin(bobPh)*.012*bobA);
  if(sleepT>=0){
   const k=Math.min(1,sleepT/1.2),kw=sleepT>4.6?Math.min(1,(sleepT-4.6)/1.2):0,kk=k*(1-kw);
   camera.position.set(lerp(p.x,sleepBed[0]+.5,kk),lerp(p.y+1.6,sleepBed[1]+.8,kk),lerp(p.z,sleepBed[2]+.5,kk));
   camera.rotation.set(pitch*(1-kk)-.25*kk,yaw,kk*1.35);
  }
 }
 updSky(dt);
 const t=target();
 if(t){box.visible=true;box.position.set(t.h[0]+.5,t.h[1]+.5,t.h[2]+.5);}else box.visible=false;
 mine(dt,t);upd(dt);updFurn(dt);furnUI();updHand(dt);
 renderer.render(scene,camera);
})(last);
applyRender();scrMain();
</script>
</body>
</html>
